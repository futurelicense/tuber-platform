{% extends "base.html" %}
{% block title %}Log in — MoneyTuber{% endblock %}
{% block content %}
<div style="max-width:380px;margin:40px auto 0;text-align:center">
  <img src="{{ url_for('static', filename='brand/logo-full.png') }}" alt="MoneyTuber — Learn. Build. Earn. Own."
       style="width:280px;max-width:80%;margin-bottom:8px">
</div>
<div class="card" style="max-width:380px;margin:0 auto">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Username or email</label>
    <input id="email" name="email" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" style="width:100%">Log in</button>
  </form>
  <div class="hint" style="margin-top:14px">Squad accounts: ask your admin. Want to earn commission
    referring people to MoneyTuber? <a href="{{ url_for('affiliate.signup') }}">Become an affiliate</a>.</div>
</div>
{% endblock %}
